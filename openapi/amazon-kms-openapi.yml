openapi: 3.1.0
info:
  title: Amazon KMS API
  description: >-
    The AWS Key Management Service API enables programmatic management of
    cryptographic keys, including creating and managing customer master keys
    (CMKs), encrypting and decrypting data, generating data keys, managing
    key policies and grants, and controlling key rotation and lifecycle.
  version: '2014-11-01'
  contact:
    name: AWS Support
    url: https://aws.amazon.com/premiumsupport/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  x-logo:
    url: https://a0.awsstatic.com/libra-css/images/logos/aws_logo_smile_1200x630.png
servers:
  - url: https://kms.{region}.amazonaws.com
    description: AWS KMS regional endpoint
    variables:
      region:
        default: us-east-1
        description: AWS region
        enum:
          - us-east-1
          - us-east-2
          - us-west-1
          - us-west-2
          - eu-west-1
          - eu-west-2
          - eu-west-3
          - eu-central-1
          - ap-northeast-1
          - ap-northeast-2
          - ap-southeast-1
          - ap-southeast-2
          - ap-south-1
          - sa-east-1
          - ca-central-1
security:
  - sigv4: []
tags:
  - name: Aliases
    description: Operations for managing key aliases
  - name: Encryption
    description: Operations for encrypting and decrypting data
  - name: Grants
    description: Operations for managing key grants
  - name: Keys
    description: Operations for creating and managing cryptographic keys
paths:
  /:
    post:
      operationId: CreateKey
      summary: Amazon KMS Create a KMS key
      description: Creates a unique customer managed KMS key for cryptographic operations.
      tags:
        - Keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Description:
                  type: string
                KeyUsage:
                  type: string
                  enum:
                    - SIGN_VERIFY
                    - ENCRYPT_DECRYPT
                    - GENERATE_VERIFY_MAC
                KeySpec:
                  type: string
                  enum:
                    - SYMMETRIC_DEFAULT
                    - RSA_2048
                    - RSA_3072
                    - RSA_4096
                    - ECC_NIST_P256
                    - ECC_NIST_P384
                    - ECC_NIST_P521
                    - ECC_SECG_P256K1
                    - HMAC_224
                    - HMAC_256
                    - HMAC_384
                    - HMAC_512
                Origin:
                  type: string
                  enum:
                    - AWS_KMS
                    - EXTERNAL
                    - AWS_CLOUDHSM
                Policy:
                  type: string
      responses:
        '200':
          description: Key created
        '400':
          description: Bad request
  /encrypt:
    post:
      operationId: Encrypt
      summary: Amazon KMS Encrypt data
      description: Encrypts plaintext into ciphertext using a KMS key.
      tags:
        - Encryption
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - KeyId
                - Plaintext
              properties:
                KeyId:
                  type: string
                Plaintext:
                  type: string
                  format: byte
                EncryptionContext:
                  type: object
                EncryptionAlgorithm:
                  type: string
      responses:
        '200':
          description: Encrypted data
  /decrypt:
    post:
      operationId: Decrypt
      summary: Amazon KMS Decrypt data
      description: Decrypts ciphertext that was encrypted by a KMS key.
      tags:
        - Encryption
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - CiphertextBlob
              properties:
                CiphertextBlob:
                  type: string
                  format: byte
                KeyId:
                  type: string
                EncryptionContext:
                  type: object
                EncryptionAlgorithm:
                  type: string
      responses:
        '200':
          description: Decrypted data
  /generate-data-key:
    post:
      operationId: GenerateDataKey
      summary: Amazon KMS Generate a data key
      description: Returns a unique symmetric data key for client-side encryption.
      tags:
        - Encryption
      responses:
        '200':
          description: Data key generated
  /keys:
    get:
      operationId: ListKeys
      summary: Amazon KMS List KMS keys
      description: Gets a list of all KMS keys in the caller's account and region.
      tags:
        - Keys
      responses:
        '200':
          description: List of keys
  /grants:
    post:
      operationId: CreateGrant
      summary: Amazon KMS Create a grant
      description: Adds a grant to a KMS key to specify who can use the key and under what conditions.
      tags:
        - Grants
      responses:
        '200':
          description: Grant created
  /aliases:
    get:
      operationId: ListAliases
      summary: Amazon KMS List aliases
      description: Gets a list of aliases in the caller's account and region.
      tags:
        - Aliases
      responses:
        '200':
          description: List of aliases
components:
  securitySchemes:
    sigv4:
      type: apiKey
      name: Authorization
      in: header
      description: AWS Signature Version 4 authentication
