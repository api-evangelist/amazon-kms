      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: amazon-kms-keys.disablekey
      with:
        KeyId: tools.KeyId
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-kms-enable-key
      description: Amazon KMS Enable Key
      hints:
        readOnly: false
