naftiko: 1.0.0-alpha1
info:
  label: Amazon KMS
  description: Amazon KMS API for managing kms resources.
  tags:
  - Amazon KMS
  - AWS
  created: '2026-04-19'
  modified: '2026-04-19'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
capability:
  consumes:
  - type: http
    namespace: kms
    baseUri: https://kms.us-east-1.amazonaws.com
    description: Amazon KMS service.
    authentication:
      type: apikey
      key: Authorization
      value: '{{AWS_ACCESS_KEY_ID}}'
      placement: header
    resources:
    - name: keys
      path: /keys
      description: KMS cryptographic key management
      operations:
      - name: createkey
        method: POST
        description: Creates a unique customer managed KMS key in your AWS account and Region.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: listkeys
        method: GET
        description: Gets a list of all KMS keys in the caller's AWS account and Region.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: describekey
        method: GET
        description: Provides detailed information about a KMS key.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: crypto
      path: /keys/{KeyId}
      description: Encryption, decryption, and signing operations
      operations:
      - name: encrypt
        method: POST
        description: Encrypts plaintext of up to 4,096 bytes using a KMS key.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: decrypt
        method: POST
        description: Decrypts ciphertext that was encrypted by a KMS key.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: generatedatakey
        method: POST
        description: Returns a unique symmetric data key for use outside of KMS.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8101
    namespace: kms-rest
    resources: []
  - type: mcp
    port: 9101
    namespace: kms-mcp
    transport: http
    tools:
    - name: createkey
      description: Creates a unique customer managed KMS key in your AWS account and Region.
      hints:
        readOnly: false
        idempotent: false
      call: kms.createkey
      outputParameters:
      - type: object
        mapping: $.
    - name: listkeys
      description: Gets a list of all KMS keys in the caller's AWS account and Region.
      hints:
        readOnly: true
        idempotent: true
      call: kms.listkeys
      outputParameters:
      - type: object
        mapping: $.
    - name: encrypt
      description: Encrypts plaintext of up to 4,096 bytes using a KMS key.
      hints:
        readOnly: false
        idempotent: false
      call: kms.encrypt
      outputParameters:
      - type: object
        mapping: $.
    - name: decrypt
      description: Decrypts ciphertext that was encrypted by a KMS key.
      hints:
        readOnly: false
        idempotent: false
      call: kms.decrypt
      outputParameters:
      - type: object
        mapping: $.
